name: Documentation
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  check-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Check translated heading anchors
        run: python scripts/check_anchors.py
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Generate blog index
        run: python scripts/generate_blog.py     
      - name: Generate print section
        run: python scripts/export_docs.py 
      - run: pip install zensical
      - run: zensical build --clean 
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
